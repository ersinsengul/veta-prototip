<!DOCTYPE html>
<html lang="tr">
<head>
  <!-- VETA 40-Screen Studio Architecture Ready -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VETA — Uçtan Uca Küresel Veteriner &amp; Saha Platformu (40 Ekran)</title>
  <style>
:root {
  --studio-bg: #ebeef4;
  --bezel: #0f1217;
  --app-bg: #f6f7f9;
  --surface: #ffffff;
  --surface-muted: #f1f4f9;
  --ink-950: #0f172a;
  --ink-800: #1e293b;
  --ink-600: #475569;
  --ink-400: #94a3b8;
  --line: #e4e8f0;
  --line-strong: #cbd5e1;
  --brand: #0f172a;
  --blue: #2563eb;
  --blue-soft: #eff6ff;
  --emerald: #059669;
  --emerald-soft: #ecfdf5;
  --amber: #d97706;
  --amber-soft: #fffbeb;
  --violet: #7c3aed;
  --violet-soft: #f5f3ff;
  --sos: #e11d48;
  --sos-soft: #fff1f2;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--studio-bg);
  background-image:
    radial-gradient(circle at 12% 14%, #ffffff 0%, transparent 52%),
    radial-gradient(circle at 88% 86%, #dfe5ef 0%, transparent 54%);
  color: var(--ink-950);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}

/* STUDIO SHELL: PHONE + HIERARCHICAL 40-SCREEN ARCHITECTURE MAP */
.studio-shell {
  max-width: 1240px;
  min-height: 100vh;
  margin: 0 auto;
  padding: 16px 22px;
  display: grid;
  grid-template-columns: 404px minmax(0, 1fr);
  gap: 32px;
  align-items: center;
}

/* PHONE HARDWARE */
.phone-chassis {
  width: 400px;
  height: 836px;
  background: var(--bezel);
  border-radius: 54px;
  padding: 11px;
  box-shadow:
    0 36px 76px -18px rgba(15, 23, 42, 0.32),
    inset 0 0 0 1.5px rgba(255, 255, 255, 0.22);
  position: sticky;
  top: 16px;
  user-select: none;
}

.phone-screen {
  width: 100%;
  height: 100%;
  background: var(--app-bg);
  border-radius: 44px;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* RAIN / MUD / HARSH SUNLIGHT FIELD RUGGED MODE (FOR SHEPHERD & FIELD VET) */
.phone-screen.field-rugged {
  --app-bg: #ffffff;
  --surface: #ffffff;
  --surface-muted: #f1f5f9;
  --line: #94a3b8;
  --line-strong: #475569;
  --ink-600: #1e293b;
}

.phone-screen.field-rugged .btn-primary,
.phone-screen.field-rugged .btn-secondary,
.phone-screen.field-rugged .bento-card,
.phone-screen.field-rugged .list-card,
.phone-screen.field-rugged .vitrin-card {
  border-width: 2px;
}

.phone-screen.field-rugged .btn-primary,
.phone-screen.field-rugged .btn-secondary {
  padding-top: 13px;
  padding-bottom: 13px;
  font-size: 13.5px;
}

/* STATUS BAR */
.ios-statusbar {
  height: 32px;
  padding: 9px 26px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11.5px;
  font-weight: 750;
  color: var(--ink-950);
  position: relative;
  flex-shrink: 0;
}

.dynamic-notch {
  width: 84px;
  height: 20px;
  background: #090b0e;
  border-radius: 20px;
  position: absolute;
  left: 50%;
  top: 7px;
  transform: translateX(-50%);
}

/* PERSISTENT CONTEXT HEADER + HIERARCHICAL BREADCRUMB */
.app-header {
  padding: 6px 14px 7px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  border-bottom: 1px solid rgba(15, 23, 42, 0.05);
  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(10px);
  flex-shrink: 0;
  z-index: 15;
}

.hdr-left {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
  flex: 1;
}

.brand-badge {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  background: var(--ink-950);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  cursor: pointer;
}

.btn-back-hdr {
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink-950);
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 800;
  padding: 5px 9px;
  border-radius: 9px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
}

.hdr-titles {
  min-width: 0;
}

.hdr-main {
  display: block;
  font-size: 13.5px;
  font-weight: 840;
  letter-spacing: -0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hdr-crumb {
  display: block;
  font-size: 9.8px;
  font-weight: 650;
  color: var(--ink-600);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hdr-actions {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}

.chip-hdr {
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink-950);
  font-family: inherit;
  font-size: 10px;
  font-weight: 800;
  padding: 5px 7px;
  border-radius: 8px;
  cursor: pointer;
}

.chip-hdr.active {
  background: #fef3c7;
  border-color: #d97706;
  color: #78350f;
}

.btn-map-mobile {
  display: none;
}

.btn-sos-pill {
  border: none;
  background: var(--sos);
  color: #ffffff;
  font-family: inherit;
  font-size: 11px;
  font-weight: 860;
  letter-spacing: 0.02em;
  padding: 6.5px 11px;
  border-radius: 99px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  box-shadow: 0 5px 12px rgba(225, 29, 72, 0.28);
}

.sos-dot {
  width: 6px;
  height: 6px;
  border-radius: 99px;
  background: #ffffff;
}

/* SCREEN VIEWPORT */
.screen-stage {
  flex: 1;
  overflow-y: auto;
  padding: 11px 14px 86px;
  scrollbar-width: none;
}

.screen-stage.no-tabbar {
  padding-bottom: 20px;
}

.screen-stage::-webkit-scrollbar {
  display: none;
}

/* REUSABLE INTERNATIONAL STUDIO UI COMPONENTS */
.screen-code-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 8px;
}

.scode-pill {
  font-size: 9.5px;
  font-weight: 820;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--blue);
  background: var(--blue-soft);
  padding: 3px 8px;
  border-radius: 99px;
}

.quota-pill {
  font-size: 9.8px;
  font-weight: 760;
  color: var(--ink-800);
  background: #ffffff;
  border: 1px solid var(--line);
  padding: 3px 8px;
  border-radius: 99px;
  cursor: pointer;
}

.h-screen {
  font-size: 18px;
  font-weight: 860;
  letter-spacing: -0.025em;
  line-height: 1.2;
  margin: 0 0 4px;
}

.p-sub {
  font-size: 11.6px;
  line-height: 1.42;
  color: var(--ink-600);
  margin: 0 0 11px;
}

.sec-lbl {
  font-size: 9.8px;
  font-weight: 820;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-600);
  margin: 10px 2px 6px;
}

/* MINI SQUIRCLE BAR */
.cute-mini-strip {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-bottom: 10px;
}

.cute-mini-btn {
  border: none;
  background: transparent;
  padding: 0;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}

.cute-mini-squircle {
  width: 53px;
  height: 53px;
  border-radius: 16px;
  padding: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(15, 23, 42, 0.08);
  box-shadow: 0 4px 10px -5px rgba(15, 23, 42, 0.1);
  overflow: hidden;
}

.cute-mini-squircle img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.sq-cat { background: linear-gradient(145deg, #ffedd5 0%, #fed7aa 100%); }
.sq-dog { background: linear-gradient(145deg, #fef3c7 0%, #fde68a 100%); }
.sq-cow { background: linear-gradient(145deg, #e0f2fe 0%, #bae6fd 100%); }
.sq-sheep { background: linear-gradient(145deg, #ede9fe 0%, #ddd6fe 100%); }
.sq-hen { background: linear-gradient(145deg, #fef9c3 0%, #fef08a 100%); }

.cute-mini-lbl {
  font-size: 10px;
  font-weight: 760;
  color: var(--ink-800);
}

/* 2x2 VITRIN SHOWCASE */
.vitrin-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-bottom: 9px;
}

.vitrin-card {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 20px;
  padding: 5px;
  text-align: left;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  box-shadow: 0 8px 18px -12px rgba(15, 23, 42, 0.1);
  transition: transform 0.14s var(--ease), border-color 0.14s ease;
}

.vitrin-card:hover {
  transform: translateY(-1px);
  border-color: var(--line-strong);
}

.vitrin-stage {
  width: 100%;
  height: 124px;
  border-radius: 15px;
  overflow: hidden;
}

.vitrin-stage img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.vitrin-meta {
  padding: 7px 7px 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.vitrin-title {
  display: block;
  font-size: 13.2px;
  font-weight: 830;
  color: var(--ink-950);
}

.vitrin-sub {
  display: block;
  font-size: 10px;
  font-weight: 620;
  color: var(--ink-600);
}

.chev-box {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  background: var(--surface-muted);
  color: var(--ink-950);
  font-size: 13px;
  font-weight: 820;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* CARDS, HEROES & BENTO */
.hero-dark {
  background: var(--ink-950);
  color: #ffffff;
  border-radius: 20px;
  padding: 13px 14px;
  margin-bottom: 9px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.hero-dark .eyebrow {
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 0.06em;
  color: #94a3b8;
  text-transform: uppercase;
  display: block;
}

.hero-dark .big-val {
  font-size: 20px;
  font-weight: 860;
  letter-spacing: -0.02em;
  display: block;
  margin: 2px 0;
}

.hero-dark .sub-val {
  font-size: 11px;
  color: #93c5fd;
  display: block;
}

.list-card {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 11px 12px;
  margin-bottom: 8px;
  text-align: left;
  font-family: inherit;
  color: var(--ink-950);
}

button.list-card {
  cursor: pointer;
  transition: border-color 0.14s ease, transform 0.12s ease;
}

button.list-card:hover {
  border-color: var(--ink-950);
}

.bento-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 9px;
}

.bento-card {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 17px;
  padding: 11px;
  text-align: left;
  font-family: inherit;
  color: var(--ink-950);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 3px;
  transition: border-color 0.14s ease, transform 0.12s ease;
}

.bento-card:hover {
  border-color: var(--ink-950);
  transform: translateY(-1px);
}

.bento-card strong {
  font-size: 12.4px;
  font-weight: 820;
  line-height: 1.22;
}

.bento-card span {
  font-size: 10.4px;
  color: var(--ink-600);
  line-height: 1.3;
}

.ic-box {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
  font-size: 14px;
  font-weight: 800;
}

.ic-blue { background: var(--blue-soft); color: var(--blue); }
.ic-emerald { background: var(--emerald-soft); color: var(--emerald); }
.ic-amber { background: var(--amber-soft); color: var(--amber); }
.ic-violet { background: var(--violet-soft); color: var(--violet); }
.ic-sos { background: var(--sos-soft); color: var(--sos); }
.ic-dark { background: var(--ink-950); color: #ffffff; }

/* SEGMENTED TABS & PILLS */
.seg-bar {
  display: flex;
  background: #e6ebf2;
  padding: 3px;
  border-radius: 12px;
  gap: 3px;
  margin-bottom: 9px;
}

.seg-btn {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--ink-600);
  font-family: inherit;
  font-size: 10.8px;
  font-weight: 780;
  padding: 6px 6px;
  border-radius: 9px;
  cursor: pointer;
  white-space: nowrap;
}

.seg-btn.active {
  background: var(--surface);
  color: var(--ink-950);
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
}

.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 9px;
}

.chip-btn {
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink-800);
  font-family: inherit;
  font-size: 10.6px;
  font-weight: 760;
  padding: 5.5px 10px;
  border-radius: 99px;
  cursor: pointer;
}

.chip-btn.active {
  background: var(--ink-950);
  border-color: var(--ink-950);
  color: #ffffff;
}

/* BADGES */
.row-between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.badge {
  font-size: 9.6px;
  font-weight: 820;
  padding: 2.5px 7px;
  border-radius: 99px;
  white-space: nowrap;
}

.b-green { background: #dcfce7; color: #15803d; }
.b-amber { background: #fef3c7; color: #b45309; }
.b-red { background: #ffe4e6; color: #be123c; }
.b-blue { background: #dbeafe; color: #1d4ed8; }
.b-slate { background: #f1f5f9; color: #475569; }
.b-gold { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; border: 1px solid #f59e0b; }

/* BUTTONS */
.btn-primary {
  width: 100%;
  border: 1px solid var(--ink-950);
  background: var(--ink-950);
  color: #ffffff;
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 820;
  padding: 11px 14px;
  border-radius: 13px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}

.btn-primary.green { background: #16a34a; border-color: #16a34a; }
.btn-primary.red { background: var(--sos); border-color: var(--sos); }
.btn-primary.blue { background: var(--blue); border-color: var(--blue); }

.btn-secondary {
  width: 100%;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink-950);
  font-family: inherit;
  font-size: 12px;
  font-weight: 780;
  padding: 10px 13px;
  border-radius: 13px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn-grid-2 {
  display: grid;
  grid-template-columns: 1.25fr 1fr;
  gap: 7px;
}

/* CAMERA / SENSOR VIEWFINDER MOCK */
.viewfinder-box {
  background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
  color: #ffffff;
  border-radius: 18px;
  padding: 14px;
  margin-bottom: 9px;
  position: relative;
  border: 1.5px solid #334155;
}

.vf-frame {
  border: 1.5px dashed rgba(147, 197, 253, 0.75);
  border-radius: 12px;
  padding: 14px 12px;
  text-align: center;
}

/* PRICING TIER CARDS (99 / 199 / 399 / 499 VIP) */
.plan-card {
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 17px;
  padding: 11px 12px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color 0.14s ease, transform 0.12s ease;
}

.plan-card:hover,
.plan-card.popular {
  border-color: var(--ink-950);
}

.plan-card.vip {
  background: linear-gradient(180deg, #fffdf7 0%, #ffffff 100%);
  border-color: #d97706;
}

.price-num {
  font-size: 16px;
  font-weight: 880;
  color: var(--ink-950);
  white-space: nowrap;
  flex-shrink: 0;
}

/* KV TABLE */
.kv-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5.5px 0;
  border-bottom: 1px dashed var(--line);
  font-size: 11.4px;
}

.kv-row:last-child {
  border-bottom: none;
}

/* VOICE DOCK */
.voice-dock-btn {
  width: 100%;
  border: none;
  background: var(--ink-950);
  color: #ffffff;
  font-family: inherit;
  padding: 11.5px 13px;
  border-radius: 17px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 10px 22px -10px rgba(15, 23, 42, 0.35);
}

/* 5-TAB BOTTOM BAR */
.bottom-tabbar {
  position: absolute;
  left: 11px;
  right: 11px;
  bottom: 9px;
  height: 55px;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-radius: 21px;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  align-items: center;
  z-index: 20;
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.1);
}

.bottom-tabbar.hidden {
  display: none;
}

.tab-btn {
  border: none;
  background: transparent;
  color: var(--ink-600);
  font-family: inherit;
  font-size: 9.5px;
  font-weight: 700;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  padding: 3px 0;
}

.tab-btn.active {
  color: var(--ink-950);
  font-weight: 860;
}

.tab-voice-center {
  margin-top: -17px;
}

.center-mic-fab {
  width: 40px;
  height: 40px;
  border-radius: 99px;
  background: var(--ink-950);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.28), 0 0 0 3.5px #ffffff;
}

/* =========================================================
   RIGHT PANEL: COMPLETE 40-SCREEN HIERARCHY & FLOW EXPLORER
   ========================================================= */
.studio-explorer {
  background: rgba(255, 255, 255, 0.78);
  backdrop-filter: blur(14px);
  border: 1px solid #dde3ee;
  border-radius: 26px;
  padding: 18px 20px;
  height: 836px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 50px -24px rgba(15, 23, 42, 0.14);
}

.exp-top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}

.exp-title {
  font-size: 20px;
  font-weight: 870;
  letter-spacing: -0.025em;
  margin: 0 0 4px;
}

.exp-sub {
  font-size: 12.2px;
  color: var(--ink-600);
  margin: 0 0 10px;
  line-height: 1.42;
}

.exp-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 10px;
}

.tree-scroll {
  flex: 1;
  overflow-y: auto;
  padding-right: 4px;
}

.mod-group {
  background: #ffffff;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 10px 12px;
  margin-bottom: 9px;
}

.mod-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11.5px;
  font-weight: 850;
  color: var(--ink-950);
  margin-bottom: 7px;
}

.tree-node {
  width: 100%;
  border: 1px solid transparent;
  background: #f8fafc;
  border-radius: 10px;
  padding: 6.5px 9px;
  margin-bottom: 4px;
  text-align: left;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;

      for (var s = 0; s < modScreens.length; s++) {
        var sc = ALL_SCREENS[modScreens[s]];
        var dCls = sc.depth === 1 ? " depth-1" : sc.depth >= 2 ? " depth-2" : "";
        var actCls = sc.code === S.cur ? " active" : "";
        var prefix = sc.depth > 0 ? "└─ " : "";
        rows +=
          "<button class=\"tree-node" + dCls + actCls + "\" onclick=\"goScreen(\x27" + sc.code + "\x27);toggleMobileMap(false)\">" +
            "<div style=\"display:flex;align-items:center;gap:6px;min-width:0\">" +
              "<span class=\"node-code\">" + sc.code + "</span>" +
              "<span style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">" + prefix + sc.title + "</span>" +
            "</div>" +
            "<span class=\"node-next\">&rarr; " + sc.next + "</span>" +
          "</button>";
      }
      groupsHtml +=
        "<div class=\"mod-group\">" +
          "<div class=\"mod-hdr\"><span>" + mod.name + "</span><span class=\"badge b-slate\">" + modScreens.length + " Ekran</span></div>" +
          rows +
        "</div>";
    }
    tree.innerHTML = groupsHtml;
    var actNode = tree.querySelector(".tree-node.active");
    if (actNode && actNode.scrollIntoView) { try { actNode.scrollIntoView({ block: "nearest" }); } catch (e) {} }
  }

  window.rerender = function () {
    var scr = ALL_SCREENS[S.cur] || ALL_SCREENS.S06;
    S.role = scr.role || "owner";
    var stage = el("screenStage");
    if (stage) {
      stage.innerHTML = scr.render(S);
    }
    renderHeader(scr);
    renderBottomTabs(scr);
    renderExplorerTree();
    hydrateImages();
  };

  window.goScreen = function (code) {
    if (!ALL_SCREENS[code]) return;
    if (S.cur && S.cur !== code) {
      navStack.push(S.cur);
      if (navStack.length > 30) navStack.shift();
    }
    S.cur = code;
    window.rerender();
    var stage = el("screenStage");
    if (stage) stage.scrollTop = 0;
  };

  window.goBack = function () {
    var curScr = ALL_SCREENS[S.cur];
    if (navStack.length > 0) {
      S.cur = navStack.pop();
    } else if (curScr && curScr.parent && ALL_SCREENS[curScr.parent]) {
      S.cur = curScr.parent;
    } else {
      S.cur = S.role === "vet" ? "S36" : "S06";
    }
    window.rerender();
  };

  window.switchRoleMode = function (role) {
    S.role = role;
    if (role === "vet" && ALL_SCREENS[S.cur].role !== "vet") {
      window.goScreen("S35");
    } else if (role === "owner" && ALL_SCREENS[S.cur].role === "vet") {
      window.goScreen("S06");
    } else {
      window.rerender();
    }
  };

  window.setLang = function (l) {
    S.lang = l;
    window.rerender();
  };

  window.cycleLanguage = function () {
    var order = ["TR", "EN", "DE"];
    S.lang = order[(order.indexOf(S.lang) + 1) % order.length];
    window.rerender();
  };

  window.toggleFieldMode = function () {
    S.fieldMode = !S.fieldMode;
    window.rerender();
  };

  window.setBilling = function (b) {
    S.billing = b;
    window.rerender();
  };

  window.selectPlan = function (name, price) {
    S.selectedPlan = name;
    S.selectedPrice = price;
    window.goScreen("S05");
  };

  window.S_toggleSetup = function () {
    window.rerender();
  };

  window.toggleMobileMap = function (open) {
    var ex = el("studioExplorer");
    if (ex) ex.classList.toggle("mobile-open", !!open);
  };

  window.downloadSelfHtml = function () {
    var html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    var blob = new Blob([html], { type: "text/html;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "VETA_40_Ekran_Tam_Mimari_Prototip.html";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 800);
  };

  // Boot & Hash Deep-Link (#s=S04, #s=S35, etc.)
  var m = (window.location.hash || "").match(/#s=(S\d\d)/);
  if (m && ALL_SCREENS[m[1]]) {
    S.cur = m[1];
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", window.rerender);
  } else {
    window.rerender();
  }
})();

</script>
</body>
</html>
